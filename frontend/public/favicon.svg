<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A27"/>
      <stop offset="100%" style="stop-color:#4A90E2"/>
    </linearGradient>
  </defs>
  
  <!-- Mountains -->
  <polygon points="20,70 40,35 60,70" fill="#1a3d1a"/>
  <polygon points="35,70 55,25 75,70" fill="#2D5A27"/>
  <polygon points="55,70 75,30 95,70" fill="#1a3d1a"/>
  
  <!-- Snow caps -->
  <polygon points="55,25 50,35 60,35" fill="white"/>
  <polygon points="75,30 70,40 80,40" fill="white"/>
  
  <!-- Curved trail -->
  <path d="M25,75 Q50,65 75,75" stroke="#FF6B35" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Pine trees -->
  <polygon points="15,75 20,55 25,75" fill="#1a3d1a"/>
  <polygon points="80,75 85,58 90,75" fill="#1a3d1a"/>
  
  <!-- Sun/Sunrise -->
  <circle cx="85" cy="20" r="8" fill="#FF6B35" opacity="0.8"/>
  
  <!-- T letter -->
  <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">T</text>
</svg>
